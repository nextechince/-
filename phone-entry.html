<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080510">
<title>Phone Entry | LUMA Chat</title>

<style>
:root {
    --purple: #a855f7;
    --light-purple: #d8b4fe;
    --cyan: #00d9ff;
    --background: #080510;
    --text: #ffffff;
    --muted: #b9a9ca;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at 50% 5%, #321052 0%, transparent 48%),
        radial-gradient(ellipse at 100% 100%, #10134a 0%, transparent 45%),
        #080510;
    color: var(--text);
    font-family: Arial, sans-serif;
}

.background-glow {
    position: fixed;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .25;
    pointer-events: none;
}

.glow-one {
    background: #a020ff;
    top: -100px;
    left: -100px;
}

.glow-two {
    background: #174dff;
    bottom: -120px;
    right: -100px;
}

.shell {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 2;
}

.card {
    position: relative;
    overflow: visible;
    padding: 34px 25px 27px;
    border-radius: 35px;
    background:
        linear-gradient(145deg, rgba(95, 36, 145, .22), rgba(13, 8, 30, .82) 45%, rgba(22, 19, 67, .58));
    border: 1px solid rgba(205, 151, 255, .5);
    box-shadow:
        0 0 12px rgba(168, 85, 247, .55),
        0 0 35px rgba(168, 85, 247, .25),
        0 0 70px rgba(67, 35, 180, .16),
        inset 0 0 30px rgba(168, 85, 247, .12);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
}

.card::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 29px;
    border: 1px solid rgba(216, 180, 254, .13);
    pointer-events: none;
}

.card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    right: -25px;
    top: -25px;
    background: rgba(168, 85, 247, .2);
    filter: blur(45px);
    pointer-events: none;
}

.logo-area {
    text-align: center;
    position: relative;
    z-index: 1;
    margin-bottom: 25px;
}

.logo-ring {
    width: 112px;
    height: 112px;
    margin: 0 auto 17px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(168, 85, 247, .25), rgba(10, 5, 30, .8));
    border: 1px solid rgba(216, 180, 254, .65);
    box-shadow:
        0 0 15px rgba(168, 85, 247, .8),
        0 0 35px rgba(168, 85, 247, .35),
        inset 0 0 20px rgba(168, 85, 247, .2);
    animation: float 4s ease-in-out infinite;
}

.logo {
    width: 76px;
    height: 76px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(216, 180, 254, .8));
}

.brand {
    font-size: 30px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #e9d5ff;
    text-shadow:
        0 0 8px #a855f7,
        0 0 20px rgba(168, 85, 247, .9);
}

.brand-sub {
    margin-top: 5px;
    font-size: 14px;
    font-style: italic;
    letter-spacing: 2px;
    color: #d8b4fe;
}

.heading {
    text-align: center;
    margin-bottom: 27px;
    position: relative;
    z-index: 1;
}

.heading h1 {
    font-size: 25px;
    margin-bottom: 10px;
    font-weight: 750;
}

.heading p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

.field-label {
    display: block;
    font-size: 13px;
    color: #e4d5f5;
    margin: 0 0 9px 4px;
    font-weight: 600;
}

.country-wrap {
    position: relative;
    margin-bottom: 19px;
    z-index: 5;
}

.country-button {
    width: 100%;
    min-height: 57px;
    padding: 0 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(184, 120, 255, .8);
    border-radius: 17px;
    color: white;
    background: linear-gradient(120deg, rgba(70, 23, 111, .7), rgba(16, 14, 48, .9));
    box-shadow:
        0 0 12px rgba(168, 85, 247, .35),
        inset 0 0 15px rgba(168, 85, 247, .12);
    cursor: pointer;
    font-size: 14px;
    text-align: left;
}

.country-button:focus-visible,
.phone-input:focus {
    outline: none;
    border-color: var(--cyan);
    box-shadow: 0 0 16px rgba(0, 217, 255, .4);
}

.country-flag {
    font-size: 23px;
}

.country-name {
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.country-code {
    color: #d8b4fe;
    font-weight: 700;
}

.chevron {
    color: #d8b4fe;
    font-size: 17px;
}

.country-menu {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    left: 0;
    right: 0;
    padding: 12px;
    border: 1px solid rgba(192, 132, 252, .7);
    border-radius: 19px;
    background: rgba(15, 8, 31, .98);
    box-shadow:
        0 0 25px rgba(168, 85, 247, .4),
        0 15px 45px rgba(0, 0, 0, .6);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    z-index: 20;
}

.country-menu.open {
    display: block;
    animation: menuIn .18s ease-out;
}

.country-search {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border-radius: 12px;
    border: 1px solid rgba(168, 85, 247, .55);
    background: rgba(255, 255, 255, .06);
    color: white;
    font-size: 14px;
    outline: none;
    margin-bottom: 10px;
}

.country-search::placeholder {
    color: #9583a9;
}

.country-list {
    max-height: 240px;
    overflow-y: auto;
    overscroll-behavior: contain;
}

.country-list::-webkit-scrollbar {
    width: 5px;
}

.country-list::-webkit-scrollbar-thumb {
    background: #8b5cf6;
    border-radius: 10px;
}

.country-option {
    display: flex;
    align-items: center;
    gap: 11px;
    width: 100%;
    padding: 11px 9px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
}

.country-option:hover,
.country-option.selected {
    background: rgba(168, 85, 247, .2);
}

.option-flag {
    font-size: 21px;
}

.option-name {
    flex: 1;
}

.option-code {
    color: #c4a0f5;
}

.no-country {
    color: #b9a9ca;
    font-size: 13px;
    padding: 15px 8px;
    text-align: center;
}

.phone-wrap {
    position: relative;
    margin-bottom: 22px;
}

.phone-box {
    position: relative;
}

.phone-icon {
    position: absolute;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    font-size: 20px;
    color: #c084fc;
    pointer-events: none;
}

.phone-input {
    width: 100%;
    height: 58px;
    padding: 0 15px 0 49px;
    border-radius: 17px;
    border: 1px solid rgba(139, 92, 246, .8);
    background: linear-gradient(110deg, rgba(50, 22, 88, .65), rgba(13, 18, 55, .85));
    color: white;
    font-size: 16px;
    letter-spacing: .5px;
    outline: none;
    box-shadow:
        0 0 13px rgba(168, 85, 247, .25),
        inset 0 0 15px rgba(168, 85, 247, .1);
    transition: .25s;
}

.phone-input::placeholder {
    color: #9984b4;
}

.phone-input:focus {
    border-color: #c084fc;
    box-shadow:
        0 0 15px rgba(168, 85, 247, .5),
        0 0 25px rgba(0, 217, 255, .12);
}

.error {
    display: none;
    padding: 12px 14px;
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid rgba(255, 80, 120, .45);
    background: rgba(255, 50, 100, .1);
    color: #ff9bb8;
    font-size: 13px;
    line-height: 1.5;
}

.continue-button {
    position: relative;
    width: 100%;
    min-height: 58px;
    border: 1px solid rgba(255, 255, 255, .6);
    border-radius: 50px;
    color: white;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: .4px;
    cursor: pointer;
    background: linear-gradient(100deg, #a020ff, #7625ff 55%, #075bff);
    box-shadow:
        0 0 12px rgba(192, 80, 255, .9),
        0 0 28px rgba(139, 45, 255, .55),
        0 0 42px rgba(0, 145, 255, .2),
        inset 0 1px 8px rgba(255, 255, 255, .35);
    transition: transform .2s, box-shadow .2s;
}

.continue-button:hover {
    transform: translateY(-2px);
    box-shadow:
        0 0 18px rgba(192, 80, 255, 1),
        0 0 38px rgba(139, 45, 255, .7),
        0 0 48px rgba(0, 145, 255, .35);
}

.continue-button:active {
    transform: scale(.98);
}

.continue-button:disabled {
    opacity: .6;
    cursor: wait;
}

.arrow {
    margin-left: 8px;
    font-size: 19px;
}

.signin {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: #bba9d1;
}

.signin a {
    color: #d8b4fe;
    font-weight: 700;
    text-decoration: none;
}

.privacy {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    color: #c5b4d9;
    font-size: 12px;
    letter-spacing: .4px;
}

.privacy span {
    color: #d8b4fe;
    text-shadow: 0 0 10px #a855f7;
}

.footer {
    text-align: center;
    margin-top: 23px;
    color: #88759e;
    font-size: 11px;
    letter-spacing: 1px;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

@keyframes menuIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
}

@media(max-width:380px) {
    body {
        padding: 15px 12px;
    }

    .card {
        padding: 28px 18px 23px;
        border-radius: 29px;
    }

    .brand {
        font-size: 26px;
    }

    .heading h1 {
        font-size: 22px;
    }
}

@media(prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<main class="shell">
    <section class="card">

        

        <div class="heading">
            <h1>Enter your phone number to continue<br>your connection journey.</br></h2>
        </div>

        <div class="error" id="error" role="alert"></div>

        <div class="country-wrap">
            <label class="field-label">Your country</label>

            <button class="country-button" id="countryButton" type="button" aria-expanded="false">
                <span class="country-flag" id="selectedFlag">🇶🇦</span>
                <span class="country-name" id="selectedName">Qatar</span>
                <span class="country-code" id="selectedCode">+974</span>
                <span class="chevron"></span>
            </button>

            <div class="country-menu" id="countryMenu">
                <input
                    class="country-search"
                    id="countrySearch"
                    type="search"
                    placeholder="Search country or calling code..."
                    autocomplete="off"
                >
                <div class="country-list" id="countryList"></div>
            </div>
        </div>

        <div class="phone-wrap">
            <label class="field-label" for="phone">Phone number</label>
            <div class="phone-box">
                <span class="phone-icon">☎</span>
                <input
                    class="phone-input"
                    id="phone"
                    type="tel"
                    inputmode="tel"
                    autocomplete="tel-national"
                    placeholder="Enter your phone number"
                    maxlength="25"
                >
            </div>
        </div>

        <button class="continue-button" id="continueButton" type="button">
            Continue <span class="arrow">→</span>
        </button>


        <div class="privacy">
            <span>♙</span>
            Secure · Private · Yours
        </div>

    </section>

    <div class="footer">LUMA CHAT · CONNECT. CHAT. BELONG.</div>
</main>

<script type="module">
import { db, firebaseReady } from "/config/firebase.js";

import {
    collection,
    query,
    where,
    limit,
    getDocs
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

import {
    getCountries,
    getCountryCallingCode,
    parsePhoneNumberFromString
} from "https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11.20/+esm";

const $ = id => document.getElementById(id);

const countryButton = $("countryButton");
const countryMenu = $("countryMenu");
const countrySearch = $("countrySearch");
const countryList = $("countryList");
const phoneInput = $("phone");
const continueButton = $("continueButton");
const errorBox = $("error");

let selectedCountry = "QA";
let countries = [];

const regionNames = new Intl.DisplayNames(
    [navigator.language || "en"],
    { type: "region" }
);

function flagEmoji(countryCode) {
    return [...countryCode.toUpperCase()]
        .map(char => String.fromCodePoint(char.charCodeAt(0) + 127397))
        .join("");
}

function getCountryName(code) {
    return regionNames.of(code) || code;
}

function buildCountries() {
    countries = getCountries()
        .map(code => ({
            code,
            name: getCountryName(code),
            callingCode: "+" + getCountryCallingCode(code),
            flag: flagEmoji(code)
        }))
        .sort((a, b) => a.name.localeCompare(b.name));

    renderCountries(countries);

    const nigeria = countries.find(country => country.code === "NG");

    if (nigeria) {
        selectCountry(nigeria);
    }
}

function renderCountries(items) {
    countryList.replaceChildren();

    if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "no-country";
        empty.textContent = "No country found";
        countryList.appendChild(empty);
        return;
    }

    items.forEach(country => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "country-option";

        if (country.code === selectedCountry) {
            button.classList.add("selected");
        }

        const flag = document.createElement("span");
        flag.className = "option-flag";
        flag.textContent = country.flag;

        const name = document.createElement("span");
        name.className = "option-name";
        name.textContent = country.name;

        const callingCode = document.createElement("span");
        callingCode.className = "option-code";
        callingCode.textContent = country.callingCode;

        button.append(flag, name, callingCode);

        button.addEventListener("click", () => {
            selectCountry(country);
            closeCountryMenu();
        });

        countryList.appendChild(button);
    });
}

function selectCountry(country) {
    selectedCountry = country.code;

    $("selectedFlag").textContent = country.flag;
    $("selectedName").textContent = country.name;
    $("selectedCode").textContent = country.callingCode;

    renderCountries(
        countries.filter(item => {
            const search = countrySearch.value.trim().toLowerCase();
            return !search ||
                item.name.toLowerCase().includes(search) ||
                item.callingCode.includes(search) ||
                item.code.toLowerCase().includes(search);
        })
    );
}

function openCountryMenu() {
    countryMenu.classList.add("open");
    countryButton.setAttribute("aria-expanded", "true");
    countrySearch.value = "";
    renderCountries(countries);
    countrySearch.focus();
}

function closeCountryMenu() {
    countryMenu.classList.remove("open");
    countryButton.setAttribute("aria-expanded", "false");
}

countryButton.addEventListener("click", () => {
    if (countryMenu.classList.contains("open")) {
        closeCountryMenu();
    } else {
        openCountryMenu();
    }
});

countrySearch.addEventListener("input", () => {
    const search = countrySearch.value.trim().toLowerCase();

    const filtered = countries.filter(country =>
        country.name.toLowerCase().includes(search) ||
        country.callingCode.includes(search) ||
        country.code.toLowerCase().includes(search)
    );

    renderCountries(filtered);
});

document.addEventListener("click", event => {
    if (!event.target.closest(".country-wrap")) {
        closeCountryMenu();
    }
});

function showError(message) {
    errorBox.textContent = message;
    errorBox.style.display = "block";
}

function clearError() {
    errorBox.textContent = "";
    errorBox.style.display = "none";
}

function setLoading(loading) {
    continueButton.disabled = loading;
    continueButton.innerHTML = loading
        ? "..."
        : 'Continue <span class="arrow"></span>';
}

async function continueWithPhone() {
    clearError();

    const rawPhone = phoneInput.value.trim();

    if (!rawPhone) {
        showError("Please enter your phone number.");
        phoneInput.focus();
        return;
    }

    const parsedPhone = parsePhoneNumberFromString(
        rawPhone,
        selectedCountry
    );

    if (!parsedPhone || !parsedPhone.isValid()) {
        showError("Please enter a valid phone number for the selected country.");
        phoneInput.focus();
        return;
    }

    const fullPhone = parsedPhone.number;

    setLoading(true);

    try {
        await firebaseReady;

        const usersQuery = query(
            collection(db, "users"),
            where("phone", "==", fullPhone),
            limit(1)
        );

        const snapshot = await getDocs(usersQuery);

        sessionStorage.setItem("pending_phone", fullPhone);

        if (!snapshot.empty) {
            const existingUser = snapshot.docs[0];

            sessionStorage.setItem(
                "signin_email",
                existingUser.data().email || ""
            );

            sessionStorage.setItem(
                "signin_uid",
                existingUser.id
            );

            location.assign("/signin-passcode");
        } else {
            location.assign("/email-entry");
        }

    } catch (error) {
        console.error(error);
        showError("We couldn't check your number. Please check your internet connection and try again.");
        setLoading(false);
    }
}

continueButton.addEventListener("click", continueWithPhone);

phoneInput.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        continueWithPhone();
    }
});

phoneInput.addEventListener("input", clearError);

buildCountries();
</script>

</body>
</html>
