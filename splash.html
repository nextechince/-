
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Luma Chat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #212121;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
}

.splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transform: translateY(-10px);
}

.logo {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 28px;
    opacity: 0;
    transform: scale(.88);
    animation: logoIn .9s ease forwards;
}

.name {
    margin-top: 28px;
    font-size: 29px;
    font-weight: 600;
    letter-spacing: -.5px;
    opacity: 7;
    animation: fadeIn .7s ease .2s forwards;
}

.tagline {
    margin-top: 8px;
    font-size: 14px;
    color: #888888;
    letter-spacing: .2px;
    opacity: 0;
    animation: fadeIn .7s ease .3s forwards;
}

.loader {
    width: 24px;
    height: 24px;
    margin-top: 48px;
    border: 2px solid rgba(88, 101, 242, .15);
    border-top-color: #5865F2;
    border-radius: 50%;
    animation: spin .8s linear infinite, fadeIn .7s ease .4s forwards;
    opacity: 0;
}

.footer {
    position: fixed;
    bottom: 24px;
    font-size: 11px;
    color: #b0b0b0;
    letter-spacing: .5px;
    opacity: 0;
    animation: fadeIn .7s ease .5s forwards;
}

@keyframes logoIn {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<main class="splash">
    <img src="/assets/images/logo.png" class="logo" alt="Luma Chat Logo">
    <h1 class="name">Luma Chat</h1>
    <p class="tagline">Fast. Simple. Secure.</p>
    <div class="loader"></div>
</main>

<footer class="footer">From Luma</footer>

<script type="module">
import { auth, firebaseReady } from "/config/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const SESSION_KEY = "luma_session_uid";
const startTime = Date.now();
const minimumDuration = 1800;

let navigated = false;

function navigate(path) {
    if (navigated) return;

    navigated = true;

    const remaining = Math.max(
        0,
        minimumDuration - (Date.now() - startTime)
    );

    setTimeout(() => {
        window.location.replace(path);
    }, remaining);
}

try {
    await firebaseReady;

    onAuthStateChanged(auth, (user) => {
        if (user) {
            localStorage.setItem(SESSION_KEY, user.uid);
            navigate("/chats");
        } else {
            localStorage.removeItem(SESSION_KEY);
            navigate("/phone-entry");
        }
    }, () => {
        localStorage.removeItem(SESSION_KEY);
        navigate("/phone-entry");
    });

} catch (error) {
    navigate("/phone-entry");
}
</script>

</body>
</html>
