<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080510">
<title>LUMA Chat</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 40%, #241039 0%, #10091c 42%, #080510 78%);
    font-family: Arial, sans-serif;
    color: white;
}

.glow {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: #a855f7;
    filter: blur(110px);
    opacity: 0.24;
    animation: glowPulse 3s ease-in-out infinite alternate;
}

.container {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 25px;
}

.logo-wrapper {
    width: 125px;
    height: 125px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 35px;
    background: linear-gradient(145deg, #26133e, #10091c);
    border: 1px solid rgba(216, 180, 254, 0.35);
    box-shadow:
        0 0 18px rgba(168, 85, 247, 0.55),
        0 0 45px rgba(168, 85, 247, 0.3),
        inset 0 0 25px rgba(168, 85, 247, 0.15);
    animation: logoFloat 3s ease-in-out infinite;
}

.logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
    filter: drop-shadow(0 0 12px rgba(216, 180, 254, 0.65));
}

.title {
    margin-top: 30px;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #ffffff, #d8b4fe, #a855f7);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.7));
    animation: textPulse 2.5s ease-in-out infinite;
}

.tagline {
    margin-top: 12px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #c4b5d9;
}

.loader {
    width: 165px;
    height: 4px;
    margin-top: 45px;
    overflow: hidden;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.1);
    box-shadow: 0 0 12px rgba(168, 85, 247, 0.2);
}

.loader-bar {
    width: 45%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #a855f7, #d8b4fe, #00d9ff);
    box-shadow: 0 0 15px #a855f7;
    animation: loading 1.5s ease-in-out infinite;
}

.loading-text {
    margin-top: 18px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #b9a3d1;
}

.footer {
    position: absolute;
    bottom: 28px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #746581;
}

@keyframes loading {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(350%); }
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
}

@keyframes glowPulse {
    from { transform: scale(0.85); opacity: 0.16; }
    to { transform: scale(1.2); opacity: 0.32; }
}

@keyframes textPulse {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.45)); }
    50% { filter: drop-shadow(0 0 18px rgba(168, 85, 247, 0.85)); }
}
</style>
</head>

<body>

<div class="glow"></div>

<main class="container">
    <div class="logo-wrapper">
        <img
            src="/assets/images/logo.png"
            class="logo"
            alt="LUMA Chat"
        >
    </div>

    <h1 class="title">LUMA CHAT</h1>

    <p class="tagline">CONNECT · CHAT · BELONG</p>

    <div class="loader">
        <div class="loader-bar"></div>
    </div>

    <p class="loading-text">PREPARING YOUR EXPERIENCE</p>
</main>

<div class="footer">From LUMA</div>

<script type="module">
import { auth, firebaseReady } from "/config/firebase.js";
import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const startedAt = Date.now();
const minimumDuration = 1800;

const savedSessionUid = localStorage.getItem("luma_session_uid");

let authUser = null;
let authResolved = false;
let navigating = false;

function navigateWhenReady() {
    if (!authResolved || navigating) return;

    const elapsed = Date.now() - startedAt;
    const remaining = Math.max(0, minimumDuration - elapsed);

    if (remaining > 0) {
        setTimeout(navigateWhenReady, remaining);
        return;
    }

    navigating = true;

    if (authUser) {
        if (savedSessionUid !== authUser.uid) {
            localStorage.setItem("luma_session_uid", authUser.uid);
        }

        location.replace("/chats");
    } else {
        localStorage.removeItem("luma_session_uid");
        location.replace("/phone-entry");
    }
}

async function startSplash() {
    try {
        await firebaseReady;

        onAuthStateChanged(
            auth,
            user => {
                authUser = user;
                authResolved = true;
                navigateWhenReady();
            },
            () => {
                authUser = null;
                authResolved = true;
                navigateWhenReady();
            }
        );
    } catch (error) {
        const remaining = Math.max(
            0,
            minimumDuration - (Date.now() - startedAt)
        );

        setTimeout(() => {
            localStorage.removeItem("luma_session_uid");
            location.replace("/phone-entry");
        }, remaining);
    }
}

startSplash();
</script>

</body>
</html>
